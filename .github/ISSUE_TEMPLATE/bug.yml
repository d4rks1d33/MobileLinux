name: "Bug report"
description: "Something in the framework, a build, or a flashed image is broken."
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: device
    attributes:
      label: Device (if applicable)
      placeholder: "rhodep (Moto G82 5G)"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. mobilelinux build rhodep --distro kali ...
        2. flashed ...
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: CLI output, dmesg, journal, or a photo of the screen.
      render: shell
  - type: input
    id: version
    attributes:
      label: MobileLinux commit / version
