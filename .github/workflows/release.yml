name: Publish device releases

# On every push to main, iterate over release/<device>/ and publish a GitHub
# Release for each device whose release.yaml has publish: true.
#
# This ONLY runs on main/master — pushes to the dev branch never publish a
# release. Work on dev, and releases happen when your changes reach main.
#
# Idempotent: if a release with the device's current tag already exists, the job
# skips it (no redundant re-publish). To ship a new release, bump version/tag in
# release/<device>/release.yaml — the new tag won't exist yet, so it publishes.
# A manual 'workflow_dispatch' run forces (re)publishing.
on:
  push:
    branches: [main, master]
    paths:
      - "release/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases + upload assets

jobs:
  discover:
    name: Discover device releases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: "Find release dirs with publish:true"
        id: set
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, glob, os
          try:
              import yaml
          except ImportError:
              os.system("pip install --quiet pyyaml")
              import yaml
          devices = []
          for meta in sorted(glob.glob("release/*/release.yaml")):
              data = yaml.safe_load(open(meta)) or {}
              if data.get("publish", False):
                  devices.append(os.path.basename(os.path.dirname(meta)))
          print("matrix=" + json.dumps({"device": devices}))
          PY

  release:
    name: Release ${{ matrix.device }}
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '' && fromJson(needs.discover.outputs.matrix).device[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Read release metadata
        id: meta
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml, os
          d = "release/${{ matrix.device }}"
          m = yaml.safe_load(open(f"{d}/release.yaml"))
          def out(k, v): print(f"{k}={v}")
          def out_multiline(k, lines):
              # GitHub Actions multiline output via heredoc delimiter.
              print(f"{k}<<__ML__")
              for ln in lines:
                  print(ln)
              print("__ML__")
          out("tag", m["tag"])
          out("title", m.get("title", m["tag"]))
          out("version", m["version"])
          out("dir", d)
          # attached release assets (excludes the large repo-only userdata image).
          # The action's 'files:' input needs ONE path per line.
          arts = [f"{d}/{a}" for a in m.get("artifacts", []) if os.path.isfile(f"{d}/{a}")]
          out_multiline("artifacts", arts)
          # repo-only large images (shipped via Git LFS, linked in the notes)
          out("repo_only", " ".join(m.get("repo_only_artifacts", [])))
          PY

      - name: Skip if this release tag already exists (idempotent)
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          # workflow_dispatch can force a re-publish; otherwise skip existing tags.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "manual dispatch: (re)publishing $tag"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "release $tag already exists and version is unchanged -> skipping (no redundant re-publish)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "release $tag does not exist -> will publish"
          fi

      - name: Package docs zip
        if: steps.exists.outputs.skip != 'true'
        run: |
          d="${{ steps.meta.outputs.dir }}"
          zip -j "${{ matrix.device }}-docs.zip" \
            "$d/README.md" "$d/CHANGELOG.md" "$d/CHECKSUMS.sha256" || true

      - name: Build release notes
        id: notes
        if: steps.exists.outputs.skip != 'true'
        run: |
          d="${{ steps.meta.outputs.dir }}"
          {
            echo "## ${{ steps.meta.outputs.title }}"
            echo
            cat "$d/CHANGELOG.md"
            echo
            echo "### Files"
            echo
            echo "Attached to this release: \`rescue.img\`, \`kali-boot.img\`."
            echo
            for f in ${{ steps.meta.outputs.repo_only }}; do
              echo "> ⚠️ **\`$f\` is NOT attached here** (it is too large for a"
              echo "> release asset). Download it from the repository (Git LFS):"
              echo ">"
              echo "> \`release/${{ matrix.device }}/$f\`"
              echo ">"
              echo "> Direct link:"
              echo "> \`https://github.com/${{ github.repository }}/raw/main/release/${{ matrix.device }}/$f\`"
              echo ">"
              echo "> or clone with LFS: \`git lfs install && git clone <repo>\`."
              echo
            done
            echo "Checksums (all images, including the repo-only userdata):"
            echo
            echo '```'
            cat "$d/CHECKSUMS.sha256"
            echo '```'
            echo
            echo "See the device README for step-by-step flashing instructions."
            echo
            echo "> ⚠️ Flash at your own risk. The authors accept no liability for"
            echo "> bricked devices or lost data. See the README's disclaimer."
          } > RELEASE_NOTES.md

      - name: Create / update GitHub Release
        if: steps.exists.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.meta.outputs.artifacts }}
            ${{ matrix.device }}-docs.zip
