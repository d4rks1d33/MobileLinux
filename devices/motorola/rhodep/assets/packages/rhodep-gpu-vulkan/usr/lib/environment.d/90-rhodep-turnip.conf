# Vulkan on the Adreno 619 through Mesa's Turnip driver (freedreno).
#
# The Vulkan loader already discovers every ICD manifest in
# /usr/share/vulkan/icd.d/, so on a device with only Turnip installed no
# variable is strictly needed. It is set here for the same reason rusticl is
# named explicitly for OpenCL: this is the one GPU the port is validated on, and
# pinning the driver by name keeps a future stray software rasteriser (lavapipe,
# pulled in as a dependency of something) from being picked ahead of the real
# GPU and quietly dropping every Vulkan app to llvmpipe speed.
#
# VK_DRIVER_FILES is the modern loader variable (>=1.3.207); VK_ICD_FILENAMES is
# the older name kept for compatibility with the loader Kali currently ships.
VK_DRIVER_FILES=/usr/share/vulkan/icd.d/freedreno_icd.json
VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/freedreno_icd.json
