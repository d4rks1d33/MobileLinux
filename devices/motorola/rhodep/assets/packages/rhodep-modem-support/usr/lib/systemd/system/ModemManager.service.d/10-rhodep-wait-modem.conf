# See /usr/local/sbin/rhodep-wait-modem: ModemManager probes qrtr0 once and
# never retries, so it has to start after the modem has registered its QMI
# services or it finds no modem and never asks for the SIM PIN.
[Unit]
After=rmtfs.service qrtr-ns.service pd-mapper.service tqftpserv.service
Wants=rmtfs.service qrtr-ns.service

[Service]
ExecStartPre=/usr/local/sbin/rhodep-wait-modem
