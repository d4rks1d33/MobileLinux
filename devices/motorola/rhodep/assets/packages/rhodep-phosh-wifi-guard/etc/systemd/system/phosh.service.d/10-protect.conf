# Shield Phosh from network churn (airmon-ng check kill, restart NetworkManager).
# If anything kills or stops it, systemd brings it back within 3s.
[Unit]
# Don't fall back to getty on tty1 on failure; just restart phosh.
OnFailure=
# Unlimited retries: never latch the unit into a permanent failed state.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=3s
# If the Wayland (phoc) teardown hangs, kill it fast instead of waiting 90s.
TimeoutStopSec=15s
