# ACP cannot profile this card: its PCMs are DPCM front ends that only open
# once a route is enabled, so it finds no usable device and creates no sink.
# Declare the nodes outright; UCM keeps the routes enabled.
#
# There is deliberately one sink, not one per output. Speaker, Earpiece and
# Headphones are all MultiMedia1, so they share hw:0,0 and differ only in which
# backend the UCM device enables, and two sinks on one PCM would just fight over
# opening it. Switching output is therefore a UCM change rather than a PipeWire
# one; see rhodep-audio-out, including the limitation when switching to the
# speaker mid-stream.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "alsa_output.rhodep.speaker"
      node.description = "Speaker"
      media.class      = "Audio/Sink"
      api.alsa.path    = "hw:0,0"
      api.alsa.period-size = 1024
      audio.channels   = 2
      audio.rate       = 48000
      audio.format     = S16LE
      node.pause-on-idle = false
    }
  }
  # Capture is MultiMedia2, so it is a separate PCM and needs its own node.
  # It only opens once the UCM Mic device is enabled, which the boot unit does.
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.source
      node.name        = "alsa_input.rhodep.mic"
      node.description = "Built-in microphone"
      media.class      = "Audio/Source"
      api.alsa.path    = "hw:0,1"
      api.alsa.period-size = 1024
      audio.channels   = 1
      audio.rate       = 48000
      audio.format     = S16LE
      node.pause-on-idle = false
    }
  }
]
