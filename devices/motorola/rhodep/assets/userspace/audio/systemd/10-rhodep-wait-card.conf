# Drop-in for the user's pipewire.service. See rhodep-wait-audio-card.
#
# Two separate problems are addressed here.
#
# The race: PipeWire opens its statically declared sink while starting and exits
# if it cannot. The card only exists once the ADSP is up and the PCM only opens
# once a route is enabled, so on a cold boot PipeWire can easily get there
# first. ExecStartPre waits for both.
#
# The permanence: five failures inside a few seconds trip systemd's default
# start limit, after which PipeWire is not retried at all and the phone has no
# audio until someone restarts it by hand over the network. Clearing the limit
# and restarting on failure turns a permanent breakage into a delay.
[Unit]
StartLimitIntervalSec=0
StartLimitBurst=0

[Service]
ExecStartPre=/usr/local/bin/rhodep-wait-audio-card
Restart=on-failure
RestartSec=3s
