# Note on how this file is structured.
#
# UCM's "which device is enabled" bookkeeping lives in the alsa-lib instance,
# not in the card, so it does not survive the alsaucm process exiting. Every
# switch is a fresh session in which no device is considered enabled, and no
# DisableSequence will run for whatever was actually up before.
#
# Each device's EnableSequence therefore tears down the paths it conflicts with
# before building its own, which makes "set _verb HiFi set _enadev X" correct no
# matter what the card was doing beforehand.
#
# The teardown deliberately does NOT live in the verb, even though that would be
# tidier, because SectionVerb's EnableSequence runs on every session that
# touches this card at all, including one that only lists devices. Putting it
# there silences the card any time something so much as looks at the UCM.
SectionVerb {
	EnableSequence [
	]

	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_1 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

# Both Awinic amplifiers hang off Secondary MI2S and play together: 0x34 is the
# loudspeaker at the bottom and 0x35 the earpiece, used as the second channel.
# Their volume control is attenuation in 0.25 dB steps from 0 to 360, so 360 is
# full scale and 0 is silent.
SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
		"Earpiece"
	]

	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_1 Audio Mixer MultiMedia1' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX_MACRO RX2 MUX' ZERO"
		cset "name='RX_MACRO RX3 MUX' ZERO"
		cset "name='Speaker Profile Set' Music"
		cset "name='Earpiece Profile Set' Music"
		cset "name='Speaker PCM Playback Volume' 360"
		cset "name='Earpiece PCM Playback Volume' 360"
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels "2"
		PlaybackPriority 100
	}
}

# Earpiece only, for calls: mute the loudspeaker and put the earpiece amplifier
# on the Awinic "Receiver" tuning profile instead of "Music".
SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_1 Audio Mixer MultiMedia1' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX_MACRO RX2 MUX' ZERO"
		cset "name='RX_MACRO RX3 MUX' ZERO"
		cset "name='Speaker PCM Playback Volume' 0"
		cset "name='Earpiece Profile Set' Receiver"
		cset "name='Earpiece PCM Playback Volume' 360"
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='Earpiece Profile Set' Music"
		cset "name='Speaker PCM Playback Volume' 360"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels "2"
		PlaybackPriority 50
	}
}

# The 3.5 mm jack, driven by the WCD9370 headphone amplifier over soundwire.
#
# The port pairing is the part that is easy to get wrong. The device tree binds
# this link to RX_CODEC_DMA_RX_1, and lpass-rx-macro.c documents that
# CDC_DMA_RX_0 drives RX0/RX1 while CDC_DMA_RX_1 drives RX2/RX3. So the
# interpolators have to take their input from RX2/RX3; feeding them from
# RX0/RX1 leaves the DSP writing into a port nothing reads, and playback dies
# with EIO a second in.
#
# RX INT0/INT1 DEM MUX must also be CLSH_DSM_OUT: HPHL_OUT and HPHR_OUT hang off
# those muxes, so with the default NORMAL_DSM_OUT the DAPM path never reaches the
# headphone amplifier at all.
SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_MACRO RX2 MUX' AIF2_PB"
		cset "name='RX_MACRO RX3 MUX' AIF2_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX2"
		cset "name='RX INT1_1 MIX1 INP0' RX3"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_RX0 Digital Volume' 74"
		cset "name='RX_RX1 Digital Volume' 74"
		cset "name='HPHL_COMP Switch' 1"
		cset "name='HPHR_COMP Switch' 1"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
		cset "name='RX_CODEC_DMA_RX_1 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_1 Audio Mixer MultiMedia1' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX_MACRO RX2 MUX' ZERO"
		cset "name='RX_MACRO RX3 MUX' ZERO"
	]

	# Detection is real: the codec's MBHC block drives this control, provided
	# the codec is kept awake (udev/90-rhodep-wcd937x-jack.rules). Switching
	# on insertion is done by rhodep-jack-watch, which follows the matching
	# input device.
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels "2"
		PlaybackPriority 200
		JackControl "Headphone Jack"
	}
}

# The microphone: WCD9370 AMIC3 -> ADC2 -> soundwire -> TX macro DEC0.
#
# AMIC3 sits behind the ADC2 input mux, so that mux has to be INP3, and
# lpass-tx-macro.c maps SWR_MIC0 to TX SWR_INPUT0, which the device tree routes
# to ADC2_OUTPUT. Hence SWR_MIC0 rather than SWR_MIC1.
#
# It is the only microphone on this board, which is worth stating because the
# device tree suggests otherwise. AMIC1, AMIC2, the four VA-macro DMICs and the
# TX-macro DMICs were all tested with sound playing into them and every one of
# them returns digital silence.
#
# Beware when testing this: enabling a capture path produces a settling DC
# transient, a one-sided ramp a few thousand samples long, before it goes quiet.
# Peak and RMS therefore look like signal on a dead input. Check the sign
# changes instead; real audio is symmetric around zero and crosses it
# constantly, and the transient never crosses at all.
SectionDevice."Mic" {
	Comment "Built-in microphone"

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2 Volume' 16"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
	]

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels "1"
		CapturePriority 100
	}
}
