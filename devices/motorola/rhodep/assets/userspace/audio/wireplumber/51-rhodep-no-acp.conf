# The card's PCMs are DPCM front ends: they only open once a route has been
# enabled, so ACP's probing finds nothing and builds no profile at all. The
# nodes are declared explicitly in pipewire.conf.d/51-rhodep-sink.conf instead,
# and UCM holds the routing.
#
# The device itself is disabled here as well, and that is not redundant. With
# ACP off WirePlumber still exposes the raw PCMs, which produces a second sink
# and a second source on the very same hardware: two nodes competing to open
# hw:0,0 and hw:0,1, whichever wins leaving the declared one silent. The raw
# capture node is also wrong in shape, since it comes up as stereo while only
# one decimator is routed, so its right channel is digital silence.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        device.disabled = true
      }
    }
  }
]
