# rhodep: keep the SM6375 interconnect provider out of the boot.
#
# It has MODULE_DEVICE_TABLE(of, ...), so udev autoloads it the moment a device
# tree with the provider nodes is booted. That is how kali-boot-v96 came up to
# a black screen: an earlier build of this module dereferenced a NULL hole in
# its node arrays inside qnoc_probe(), which runs while icc_node_create() holds
# icc_lock. The thread died with the lock held, every interconnect consumer
# blocked behind it - the eight CPUs among them - and the deferred probe queue
# never moved again. The kernel had reached systemd at 7 s and then simply
# stopped.
#
# The bug is fixed (dense per-bus node arrays, see kernel/patches/0027), but
# the module stays out of the boot until it has been loaded by hand at least
# once on a device tree that has the provider nodes. Loading it by hand costs a
# reboot if it goes wrong; letting udev do it costs a reflash.
#
#	modprobe qnoc-sm6375     # then check dmesg
#	modprobe ipa             # only after the provider is up
blacklist qnoc-sm6375
install qnoc-sm6375 /bin/false
