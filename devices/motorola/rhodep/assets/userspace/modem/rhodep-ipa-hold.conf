# rhodep: keep the IPA out of the boot until the watchdog bug is fixed.
#
# THIS FILE IS THE ONLY THING STANDING BETWEEN THIS PORT AND WORKING MOBILE
# DATA. Everything else on the modem side is done and proven: the radio comes
# up, the phone registers on LTE, data reached ~24 Mbit/s, calls connect and
# SMS arrives. Delete this file and reboot and all of that comes back.
#
# What it costs while it is here:
#   - no mobile data: rmnet_ipa0 and qmapmux0.0 never appear
#   - no ModemManager at all, so no dialer, no SMS UI, no mmcli. MM refuses the
#     modem without a net port:
#       [base-manager] couldn't create modem for device 'qcom-soc':
#       Failed to find a net port in the QMI modem
#     The QMI layer itself still works, e.g. `qmicli -d qrtr://0 --dms-get-ids`.
#
# Why it is here: with ipa.ko loaded AND the modem registered on a network the
# SoC watchdog-resets every 3 to 10 minutes, silently, with the ramoops console
# stopping mid-line. Either one alone is stable (23 min and 16.5 min observed).
# Full bisection, everything ruled out with evidence, and the leads worth
# chasing are in HANDOFF-SESSION4.md session 14, "OPEN BUG".
#
# To work on it: do NOT just delete this file, because the interesting window
# is short and a reset costs a reboot. Boot with the file in place, bring the
# radio up by hand, confirm `registered`, and only then load the module with
# debugging on, so the causal window is a few seconds wide:
#
#	/usr/local/sbin/rhodep-uim-provision
#	qmicli -d qrtr://0 --dms-set-operating-mode=online
#	qmicli -d qrtr://0 --nas-get-serving-system     # wait for 'registered'
#	insmod /lib/modules/7.2.0-rc5/kernel/drivers/net/ipa/ipa.ko dyndbg==p
#
# And log uptime from a systemd unit rather than trusting ssh: the screen
# locking takes WiFi down and is indistinguishable from a reset. The real
# answer is per-boot, in the journal:
#	journalctl -b -N -k | grep -m1 "Kernel command line"   # -> bootreason=
blacklist ipa
install ipa /bin/false
