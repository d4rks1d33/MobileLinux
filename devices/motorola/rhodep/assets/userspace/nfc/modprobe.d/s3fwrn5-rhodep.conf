# The S3NRN4V on this phone takes the single-opcode (dual) RF register
# transfer and nothing loads it without being told to. Without this line the
# driver comes up on the legacy transfer, the chip answers on the bus but
# generates no field, and it reads nothing. clk_speed is left at its default;
# the dual path already sends 0x11, which is what this board's antenna wants.
options s3fwrn5 rfreg_dual=1
