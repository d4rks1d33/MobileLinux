# When the phone should stay awake with the screen off.
#
# It does not match program names. It watches for work: a process burning CPU
# is doing something, a shell sitting at a prompt is not. So whatever you start
# tomorrow is covered without being listed here, and the port's own idle
# services do not count.

# How often to look, in seconds.
interval: 15

# A process must use more than this share of one CPU, averaged over the
# interval, to count as working. An idle desktop with the screen off stays well
# under 3%. Raise it if something harmless keeps the phone awake; lower it if
# something real is being missed.
cpu_percent: 3

# Below this battery percentage the hold is dropped even if work is running,
# unless the phone is charging. A flat phone in your pocket is a worse outcome
# than an interrupted capture, and it is the one you cannot see coming.
battery_floor: 20

# Processes to never count, by the name in /proc/<pid>/stat.
#
# The compositor and the shell are here because they are display furniture, not
# work: with the screen on they sit well above the threshold and would hold the
# phone awake permanently, and with the screen on it was not going to suspend
# anyway. If they are still busy once the screen is off that is a bug in them,
# and staying awake would hide it rather than fix it.
ignore: kwin_wayland
ignore: plasmashell
ignore: Xwayland

# Always hold while these are running, whether or not they are using CPU.
# For jobs that spend their time blocked -- waiting on the network, on a device,
# on a long sleep -- which the CPU heuristic will not see.
#   unit:NAME.service   a systemd service
#   proc:NAME           a process, by exact binary name
#   procf:PATTERN       matched anywhere in the command line. Prefer proc:,
#                       because this also matches a shell that merely mentions
#                       the name -- it once matched the ssh command used to
#                       test it, and the hold outlived the job by hours.
#
# unit:bettercap.service
# proc:airodump-ng

# WiFi auditing spends its time waiting for packets, not burning CPU, so the
# CPU heuristic above will not catch it. These are anchored explicitly. If the
# pwnagotchi stack is not what you run, they simply never match.
unit:rhodep-pwnagotchi.service
unit:rhodep-pwn-bettercap.service
unit:rhodep-pwngrid-peer.service

# Bjorn (extra-tools/nethunter-pro-app) scans and waits on the network the same
# way, so the CPU heuristic misses it too. Never matches if Bjorn is not run.
unit:bjorn.service

# Work started from a terminal, without having to name it first.
#
# A non-shell process inside a tty or pts login session counts as work:
# wifite, tshark, a build, as root or not. This is what makes "start
# something, lock the screen, come back later and find it still running"
# true for things that wait on the network or a device rather than burning
# CPU, which the cpu_percent heuristic cannot see.
#
# The graphical session is excluded by its Type, not by name: it is full of
# long-lived non-shell processes and would pin the phone awake for ever.
#
# Shells at a prompt do not count, and neither does the session plumbing --
# sshd above all, or every ssh login would look like work and the phone would
# never sleep while anyone was connected. Add anything else with `ignore:`.
#
# Set to no to go back to the named list plus the CPU heuristic only.
terminal_work: yes

# Adding to the list above
#
# Use the helper rather than editing by hand -- it resolves the unit name,
# refuses one systemd has never heard of (a typo here looks like it worked and
# then the phone sleeps anyway), and takes the immutable bit off and back on:
#
#     rhodep-awake add apache2      # then plain `systemctl start apache2` is enough
#     rhodep-awake list
#     rhodep-awake rm apache2
#     rhodep-awake status           # what is holding the phone awake right now
#
# The daemon re-reads this file every interval, so an entry takes effect within
# seconds. Nothing needs restarting.
