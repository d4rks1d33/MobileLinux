# rhodep: iio-sensor-proxy asks the sensor core for its sensors exactly once,
# at startup, and believes the answer.  On this device the sensor core has no
# sensors at all until rhodep-sscrpcd has fed it the registry, so starting the
# proxy first gives a phone with no sensors, no error and nothing in any log.
#
# rhodep-sscrpcd.service does not report started until a real sensor answers,
# so ordering after it is enough.
[Unit]
After=rhodep-sscrpcd.service
Wants=rhodep-sscrpcd.service
