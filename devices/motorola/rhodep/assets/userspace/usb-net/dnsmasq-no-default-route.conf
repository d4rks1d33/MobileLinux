# The phone hands out an address over USB but does NOT offer itself as the way
# to the internet.
#
# NetworkManager's "shared" method starts dnsmasq advertising both a router and
# a DNS server. On the machine at the other end of the cable that is a default
# route pointing at a phone which is not routing anything useful, so it can
# quietly take over as the preferred path and leave that machine with no
# internet. macOS in particular will happily reorder its network services this
# way.
#
# Sending options 3 (router) and 6 (DNS) empty suppresses both. The connected
# machine still gets an address and can still reach the phone, and nothing else
# about its networking changes.
dhcp-option=3
dhcp-option=6
