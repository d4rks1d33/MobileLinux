schema_version: 1

id: oneplus-enchilada
vendor: oneplus
model: OnePlus 6
codename: oneplus-enchilada
aliases: [enchilada]
year: 2018
chassis: handset
architecture: aarch64
maturity: community

soc:
  vendor: qualcomm
  family: sdm845
  marketing_name: Snapdragon 845
  platform: qcom-sdm845

kernel:
  type: mainline
  version: "6.6"            # near-mainline SDM845 tree
  build:
    method: pmbootstrap
    pmaports_pkg: linux-postmarketos-qcom-sdm845

device_tree:
  dtb: sdm845-oneplus-enchilada.dtb
  append_dtb: true          # DTB concatenated to the kernel Image (Android append_dtb)
  source: in-kernel

hardware:
  display:
    status: supported
    driver: msm/DRM (DSI)
    evidence: pmOS wiki OnePlus_6 'Working'; research-pmos-devices.md Device 2
    notes: 1080x2280
    test: display
  touchscreen:
    status: supported
    driver: msm touch
    evidence: pmOS wiki OnePlus_6 'Working'
    test: touch
  gpu:
    status: supported
    driver: Adreno 630 (freedreno/msm, a6xx)
    evidence: pmOS wiki OnePlus_6; accelerated freedreno
    test: gpu
  storage:
    status: supported
    driver: UFS
    evidence: research-pmos-devices.md Device 2 (rootfs_image_sector_size=4096)
    test: storage
  usb:
    status: supported
    driver: dwc3
    evidence: pmOS wiki OnePlus_6 'Working'
    test: usb
  wifi:
    status: supported
    driver: ath10k (QCA)
    evidence: pmOS wiki OnePlus_6 'Working'
    test: wifi
  bluetooth:
    status: supported
    driver: hci_qca
    evidence: pmOS wiki OnePlus_6 'Working'
    test: bluetooth
  audio:
    status: supported
    driver: soc-qcom-sdm845-ucm + q6voiced (incl. call audio)
    evidence: research-pmos-devices.md Device 2; pmOS wiki OnePlus_6
    notes: "call audio works (q6voiced)"
    test: audio
  battery:
    status: supported
    driver: qcom battery/fuel gauge
    evidence: pmOS wiki OnePlus_6 'Working'
    test: battery
  charging:
    status: supported
    driver: qcom charger
    evidence: pmOS wiki OnePlus_6 'Working'
    test: charging
  modem:
    status: supported
    driver: qrtr + hexagonrpcd + soc-qcom-sdm845-modem
    evidence: research-pmos-devices.md Device 2; pmOS wiki OnePlus_6
    test: modem
  gnss:
    status: supported
    driver: QMI LOC via modem
    evidence: research-pmos-devices.md Device 2 (GNSS via modem/QMI)
    test: gnss
  nfc:
    status: partial
    driver: NFC (WIP)
    evidence: research-pmos-devices.md Device 2 (NFC partial)
    test: nfc
  fingerprint:
    status: broken
    driver: in-display fingerprint
    evidence: research-pmos-devices.md Device 2 (in-display, hard)
    notes: "in-display sensor; not functional on mainline"
  camera:
    status: partial
    driver: CAMSS (WIP)
    evidence: research-pmos-devices.md Device 2 (camera partial/WIP)
    test: camera
  sensors:
    status: supported
    driver: qcom sensors
    evidence: pmOS wiki OnePlus_6 'Working'
    test: sensors
  vibrator:
    status: supported
    driver: qcom vibrator
    evidence: pmOS wiki OnePlus_6 'Working'
    test: vibrator

boot:
  method: android-bootimg
  android_bootimg:
    header_version: 0         # v0/v1 style, QCDT off
    pagesize: 4096
    offsets:
      kernel: "0x00008000"
      ramdisk: "0x01000000"
      tags: "0x00000100"
    cmdline: "console=ttyMSM0,115200"
  initramfs:
    type: postmarketos
    features: [loop-gpt-4096]

storage:
  rootfs_layout: gpt-in-partition   # rootfs image is a GPT disk written inside userdata
  rootfs_sector_size: 4096          # UFS native 4K
  partitions:
    - name: boot
      role: boot
      device_path: /dev/disk/by-partlabel/boot
      writable_via: [fastboot]
    - name: userdata
      role: rootfs
      device_path: /dev/disk/by-partlabel/userdata
      writable_via: [fastboot]      # bootloader-mode fastboot writes userdata directly
      notes: "pmOS rootfs image carries its own boot/root subpartition table, sector 4096"

install:
  strategy: fastboot
  ab_slots: true
  slots: [a, b]
  fastbootd: false                  # bootloader-mode fastboot only; no fastbootd needed
  unlock_required: true             # fastboot oem unlock (wipes userdata)
  boot_partition: boot
  rootfs_target:
    partition: userdata
    method: fastboot
  steps:
    - action: flash-partition
      description: "Flash the Android boot image to the boot partition"
      partition: boot
      image: boot
      via: fastboot
      destructive: true
    - action: dd-partition
      description: "Write the pmOS rootfs image to userdata (fastboot flash)"
      partition: userdata
      image: rootfs
      via: fastboot
      destructive: true
    - action: set-active-slot
      slot: a
      via: fastboot
    - action: reboot
      via: fastboot

ota:
  strategy: ab
  rollback: true
  slots: [a, b]
  bootloader_integration:
    type: android-bootctl        # slot selection via Android misc (qbootctl)
    backend: rauc-custom
  updatable:
    rootfs: true
    kernel: true
    initramfs: true
    firmware: false
    bootloader: false

tests:
  - boot
  - display
  - touch
  - gpu
  - storage
  - usb
  - wifi
  - bluetooth
  - audio
  - battery
  - charging
  - modem
  - gnss
  - nfc
  - sensors
  - vibrator

sources:
  imported_from: pmaports
  postmarketos_wiki: https://wiki.postmarketos.org/wiki/OnePlus_6_(oneplus-enchilada)
  pmaports: device/community/device-oneplus-enchilada
