schema_version: 1
id: pine64-pinephone
vendor: pine64
model: PinePhone
codename: pine64-pinephone
aliases:
- pinephone
- PinePhone
year: 2019
chassis: handset
architecture: aarch64
maturity: community
soc:
  vendor: allwinner
  family: a64
  marketing_name: Allwinner A64
  platform: sun50i
kernel:
  type: mainline
  version: 6.6.30
  source: https://cdn.kernel.org/pub/linux/kernel/
  provider:
    kind: postmarketos
    upstreamed: true
    source: https://gitlab.com/postmarketOS/pmaports
    pmaports_ref: device/community/device-pine64-pinephone
    linux_pkg: linux-postmarketos-allwinner
    device_pkg: device-pine64-pinephone
  flavors:
    pmos:
      config_fragment: ''
      distros:
      - postmarketos
  build:
    toolchain: gcc
    method: pmbootstrap
    image: Image
    deb_package: false
device_tree:
  dtb: allwinner/sun50i-a64-pinephone-1.2.dtb
  overlays:
  - allwinner/sun50i-a64-pinephone-1.1.dtb
  source: in-kernel
firmware:
  redistributable: true
  package: firmware-pine64-rtl8723bt
  provides:
  - wifi
  - bluetooth
hardware:
  display:
    status: supported
    driver: sun4i-drm (DSI, Xingbangda XBD599 panel)
    evidence: postmarketos wiki 'PINE64 PinePhone'; reference mainline device
    notes: 720x1440 IPS, mainline sun50i
    test: display
  touchscreen:
    status: supported
    driver: Goodix GT917S (goodix)
    evidence: postmarketos wiki 'PINE64 PinePhone'
    test: touch
  gpu:
    status: supported
    driver: Mali-400 (Lima), accelerated
    evidence: postmarketos wiki; Lima GLES on mainline
    test: gpu
  storage:
    status: supported
    driver: sunxi-mmc (eMMC + bootable microSD)
    evidence: postmarketos wiki; dev_internal_storage=/dev/mmcblk2
    test: storage
  usb:
    status: supported
    driver: musb / phy-sun4i-usb (Type-C, role-switch)
    evidence: postmarketos wiki; USB gadget + host on mainline
    test: usb
  wifi:
    status: supported
    driver: RTL8723CS (rtw88 / sdio)
    evidence: postmarketos wiki; firmware-pine64-rtl8723bt
    test: wifi
  bluetooth:
    status: supported
    driver: RTL8723CS (hci_uart / btrtl)
    evidence: postmarketos wiki; firmware-pine64-rtl8723bt
    test: bluetooth
  audio:
    status: supported
    driver: sun8i-codec + AC100/analog codec
    evidence: postmarketos wiki; in-call audio works
    notes: includes call audio routing
    test: audio
  battery:
    status: supported
    driver: axp20x_battery (AXP803 PMIC)
    evidence: postmarketos wiki; AXP803 fuel gauge on mainline
    test: battery
  charging:
    status: supported
    driver: axp20x_usb_power (AXP803 PMIC)
    evidence: postmarketos wiki; AXP803 charger on mainline
    test: charging
  modem:
    status: supported
    driver: Quectel EG25-G (external, ModemManager)
    evidence: postmarketos wiki; EG25-G is well supported via ModemManager
    notes: separate firmware domain; own modem firmware
    test: modem
  gnss:
    status: supported
    driver: GNSS via Quectel EG25-G modem
    evidence: postmarketos wiki; GNSS exposed through EG25-G
    test: gnss
  nfc:
    status: not-present
    evidence: postmarketos wiki; device has no NFC hardware
  fingerprint:
    status: not-present
    evidence: postmarketos wiki; device has no fingerprint sensor
  camera:
    status: partial
    driver: OV5640 (front) / GC2145 (rear) via sun6i-csi
    evidence: postmarketos wiki; firmware-pine64-ov5640
    notes: capture works with caveats; imperfect
    caveats:
    - imaging quality/feature set incomplete on mainline
    test: camera
  sensors:
    status: supported
    driver: iio sensors (accelerometer/magnetometer/light/proximity)
    evidence: postmarketos wiki; iio-sensor-proxy auto-rotation
    test: sensors
  vibrator:
    status: supported
    driver: gpio-vibrator
    evidence: postmarketos wiki
    test: vibrator
boot:
  method: uboot-extlinux
  initramfs:
    type: postmarketos
    features:
    - usb-gadget-net
    - debug-shell
storage:
  rootfs_layout: whole-disk
  rootfs_sector_size: 512
  partitions:
  - name: internal
    role: rootfs
    device_path: /dev/mmcblk2
    writable_via:
    - dd
    notes: whole-disk image; U-Boot SPL dd'd at 8 KiB offset. SD overrides eMMC (rescue).
install:
  strategy: sdcard
  ab_slots: false
  fastbootd: false
  unlock_required: false
  rootfs_target:
    partition: internal
    method: sdcard-image
  rescue:
    required: false
    method: jumpdrive
    transport: usb-mass-storage (Jumpdrive exposes eMMC as a USB block device to the host)
    notes: 'No vendor recovery needed. The A64 BROM looks for U-Boot SPL on microSD before eMMC, so a
      bootable SD card naturally overrides an eMMC install and is the primary rescue path. To reach the
      eMMC from a host, boot the Jumpdrive helper which exposes eMMC as USB mass storage.

      '
  steps:
  - action: message
    description: 'sdcard: a whole-disk image (rootfs + embedded U-Boot SPL) is written to the SD/eMMC
      block device'
  - action: dd-partition
    description: Write the whole-disk image to the target block device (SD or eMMC) via dd
    partition: internal
    image: rootfs
    via: dd
    destructive: true
  - action: message
    description: Power on the device; U-Boot loads the kernel via extlinux/boot.scr (SD boots before eMMC)
ota:
  strategy: single-rootfs
  rollback: false
  bootloader_integration:
    type: none
    backend: none
  updatable:
    rootfs: true
    kernel: true
    initramfs: true
    device_packages: true
    firmware: false
    bootloader: false
tests:
- boot
- display
- touch
- gpu
- storage
- usb
- wifi
- bluetooth
- audio
- battery
- charging
- modem
- gnss
- sensors
- vibrator
sources:
  imported_from: pmaports
  postmarketos_wiki: https://wiki.postmarketos.org/wiki/PINE64_PinePhone
  pmaports: device/community/device-pine64-pinephone
  notes: 'Hardware statuses are evidence-based from the postmarketOS wiki and research-pmos-devices.md
    (Device 1). One of the reference mainline phones (Allwinner A64, sun50i). Modem is a separate Quectel
    EG25-G firmware domain.

    '
