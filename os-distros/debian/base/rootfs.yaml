# Debian base rootfs (debos, Mobian recipes).
# Debian is Debian-based, so it reuses the shared debian-family pipeline
# (DebianBackend): clone the recipe, inject the generated device.toml + the
# kernel-stage linux-image .deb, run debos, then the chroot integration phase.
recipe:
  source: https://salsa.debian.org/Mobian-team/mobian-recipes.git
  ref: master
  rootfs_yaml: rootfs.yaml
  image_yaml: image.yaml
parameters:
  suite: trixie
  variant: nonfree
# Output: rootfs-<arch>-<desktop>-debian.tar.xz
