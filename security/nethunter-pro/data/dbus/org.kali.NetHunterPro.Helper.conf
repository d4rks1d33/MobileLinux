<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root owns the helper name. -->
  <policy user="root">
    <allow own="org.kali.NetHunterPro.Helper"/>
  </policy>

  <!-- Any active user may call it; polkit decides per action. -->
  <policy context="default">
    <allow send_destination="org.kali.NetHunterPro.Helper"
           send_interface="org.kali.NetHunterPro.Helper"/>
    <allow send_destination="org.kali.NetHunterPro.Helper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
