  <!-- stacked containers on the whale's back -->
  <path d="M 3,5 h 1.6 v 1.6 H 3 Z M 5,5 h 1.6 v 1.6 H 5 Z M 7,5 h 1.6 v 1.6 H 7 Z M 5,3 h 1.6 v 1.6 H 5 Z M 7,3 h 1.6 v 1.6 H 7 Z M 9,5 h 1.6 v 1.6 H 9 Z"/>
  <!-- whale body and water line -->
