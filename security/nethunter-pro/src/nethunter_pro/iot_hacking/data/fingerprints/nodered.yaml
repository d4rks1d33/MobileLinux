id: node-red
version: 1
device_type: hub
vendor: Node-RED
family: node-red
threshold: 60
matchers:
  - name: port-1880
    type: port
    port: 1880
    confidence: 40
  - name: http-settings
    type: http_body
    path: /red/settings.json
    regex: 'Node-RED|nodeRedVersion'
    confidence: 80
    extract:
      version: '"version":"([^"]+)"'
metadata:
  playbook: node-red
